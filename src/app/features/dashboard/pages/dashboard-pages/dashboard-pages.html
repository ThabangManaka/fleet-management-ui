<div class="dashboard">

  <div class="page-header">
    <div>
      <h1>Dashboard</h1>
      <p>Fleet overview and operational performance</p>
    </div>
  </div>

  <!-- Date Filters -->
  <div class="filter-card">

    <div class="filter-field">
      <label for="fromDate">
        From Date
      </label>

      <input
        id="fromDate"
        type="date"
        [value]="fromDate()"
        (change)="setFromDate($event)">
    </div>

    <div class="filter-field">
      <label for="toDate">
        To Date
      </label>

      <input
        id="toDate"
        type="date"
        [value]="toDate()"
        (change)="setToDate($event)">
    </div>

    <div class="filter-actions">

      <button
        type="button"
        class="btn-primary"
        (click)="applyDateFilter()"
        [disabled]="loading()">

        Apply Filter

      </button>

      <button
        type="button"
        class="btn-secondary"
        (click)="clearDateFilter()"
        [disabled]="loading()">

        Clear

      </button>

    </div>

  </div>

  @if (loading()) {

    <div class="state-card">
      Loading dashboard...
    </div>

  } @else if (error()) {

    <div class="state-card error">
      Failed to load dashboard data.
    </div>

  } @else if (dashboard(); as data) {

    <!-- keep the rest of your existing dashboard here -->

  }

</div>
